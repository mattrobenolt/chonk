name: debug-factory
on:
  push:
    branches:
      - debug-factory

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: trace factory recipe
        run: |
          nix develop --command bash -c '
            just -n factory 2>/tmp/f.sh
            wc -l /tmp/f.sh
            bash -x /tmp/f.sh
          '
