name: chonk

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      # just build = zig build + zig build test + ziglint. Arch-blind:
      # the CLI, both cross-compiled freestanding stubs, the unit suite,
      # and lint all pass on any host arch.
      - name: Build + unit tests + lint
        run: nix develop --command just build

  test-arm:
    name: e2e aarch64 (native + qemu tier matrix)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      # The full battery (tests/e2e.sh) — the host arch picks the native
      # legs, the qemu legs run everywhere. The native aarch64 dispatch
      # tiers depend on the runner's silicon (the pool is not all
      # no-SVE Altra); the tolerant assertions accept the known set.
      - name: Full e2e battery (aarch64 host)
        run: nix develop --command just test

  test-x86:
    name: e2e x86_64 (native dispatch — the wall's other side)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      # The same battery on an x86_64 host: the native legs run the full
      # dispatch path that the aarch64 dev box cannot run (qemu hands
      # foreign-arch execveat to the host kernel — the errno 8 wall).
      # The CPUID conditions select a tier on real x86 hardware.
      - name: Full e2e battery (x86_64 host)
        run: nix develop --command just test
