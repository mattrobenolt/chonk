# zizmor's self-repository audit recommends GitHub's `uses: $/...` syntax
# (github.blog 2026-07-30), but the parser cannot LOAD it: a `$/...` ref fails
# with "malformed `uses` ref: missing `@<ref>`" (verified on 1.32.0,
# 2026-11-18). Ignore our two workflow files until the parser lands; then flip
# every `./.github/actions/...` to `$.github/actions/...` and delete this block.
rules:
  self-repository:
    ignore:
      - chonk.yaml
      - github-actions-security.yaml
