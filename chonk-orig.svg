<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" role="img" aria-label="chonk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fur    { fill: #F2A541; }
    .stripe { stroke: #D9822B; }
    .cream  { fill: #FCE3BF; }
    .ink    { stroke: #2A2521; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pink   { fill: #E8877A; }
    .shadow { fill: #1F2328; opacity: 0.12; }
    .word   { fill: #1F2328; }
    @media (prefers-color-scheme: dark) {
      .word   { fill: #E6EDF3; }
      .shadow { fill: #000; opacity: 0.35; }
    }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="150" cy="206" rx="92" ry="8"/>

  <!-- tail -->
  <path d="M220 182 C272 186 286 132 252 116" fill="none" stroke="#E6923A" stroke-width="18" stroke-linecap="round"/>

  <!-- body -->
  <ellipse class="fur" cx="150" cy="150" rx="90" ry="56"/>
  <ellipse class="cream" cx="150" cy="163" rx="50" ry="36"/>

  <!-- paws -->
  <ellipse class="cream" cx="126" cy="200" rx="17" ry="9"/>
  <ellipse class="cream" cx="174" cy="200" rx="17" ry="9"/>

  <!-- ears -->
  <path class="fur" d="M108 76 L113 36 L142 56 Z" stroke="#F2A541" stroke-width="8" stroke-linejoin="round"/>
  <path class="fur" d="M192 76 L187 36 L158 56 Z" stroke="#F2A541" stroke-width="8" stroke-linejoin="round"/>
  <path class="pink" d="M117 62 L120 46 L133 55 Z" opacity="0.7"/>
  <path class="pink" d="M183 62 L180 46 L167 55 Z" opacity="0.7"/>

  <!-- head -->
  <circle class="fur" cx="150" cy="96" r="50"/>

  <!-- forehead stripes -->
  <g class="stripe" stroke-width="4.5" stroke-linecap="round">
    <line x1="139" y1="58" x2="140" y2="68"/>
    <line x1="150" y1="55" x2="150" y2="68"/>
    <line x1="161" y1="58" x2="160" y2="68"/>
  </g>

  <!-- cheeks -->
  <circle class="pink" cx="121" cy="110" r="7" opacity="0.35"/>
  <circle class="pink" cx="179" cy="110" r="7" opacity="0.35"/>

  <!-- content, extremely unbothered eyes -->
  <path class="ink" stroke-width="4" d="M125 92 q8 7 16 0"/>
  <path class="ink" stroke-width="4" d="M159 92 q8 7 16 0"/>

  <!-- nose + mouth -->
  <path class="pink" d="M145 101 h10 l-5 5.5 z"/>
  <path class="ink" stroke-width="3" d="M150 106.5 q-4 6 -10 3 M150 106.5 q4 6 10 3"/>

  <!-- whiskers -->
  <g class="ink" stroke-width="2.5" opacity="0.55">
    <path d="M116 104 L88 99"/>
    <path d="M116 111 L90 115"/>
    <path d="M184 104 L212 99"/>
    <path d="M184 111 L210 115"/>
  </g>

  <!-- wordmark -->
  <text class="word" x="286" y="142"
        font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="88" font-weight="900" textLength="286" lengthAdjust="spacingAndGlyphs">chonk</text>
</svg>
